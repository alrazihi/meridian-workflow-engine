name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Spotless Check
        run: cd backend && mvn -B spotless:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service
      - name: Run Checkstyle
        run: cd backend && mvn -B checkstyle:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service
      - name: Run SpotBugs
        run: cd backend && mvn -B spotbugs:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: meridian-workflow-engine
          path: backend
          format: HTML
          output: security-report
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Unit Tests
        run: cd backend && mvn -B test -pl meridian-domain,meridian-application -Dmaven.test.failure.ignore=false
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/meridian-domain/target/site/jacoco/jacoco.xml,./backend/meridian-application/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Integration Tests
        run: cd backend && mvn -B verify -pl meridian-infrastructure,meridian-workflow-service -am -DskipUnitTests -Dmaven.test.failure.ignore=false

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t meridian-backend ./backend/meridian-workflow-service
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: meridian-backend
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
