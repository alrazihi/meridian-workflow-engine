name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Spotless Check
        run: cd backend && mvn -B spotless:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service
      - name: Run Checkstyle
        run: cd backend && mvn -B checkstyle:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service
      - name: Lint Frontend
        run: cd frontend/angular-admin && npm ci && npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Unit Tests
        run: cd backend && mvn -B test -pl meridian-domain,meridian-application
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/meridian-domain/target/site/jacoco/jacoco.xml,./backend/meridian-application/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meridian
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Integration Tests
        run: cd backend && mvn -B verify -pl meridian-infrastructure,meridian-workflow-service -DskipUnitTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/meridian
          SPRING_DATASOURCE_USERNAME: meridian
          SPRING_DATASOURCE_PASSWORD: meridian

  build-and-push:
    needs: [lint-and-format, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/angular-admin/package-lock.json
      - name: Build Backend
        run: cd backend && mvn -B package -DskipTests -pl meridian-workflow-service -am
      - name: Build Frontend
        run: cd frontend/angular-admin && npm ci && npm run build
      - name: Build and Push Docker Image
        run: |
          docker build -t meridian-workflow-engine:${{ github.sha }} -f backend/meridian-workflow-service/Dockerfile .
          echo "Docker image built for ${{ github.sha }}"

