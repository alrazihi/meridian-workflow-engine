name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Spotless Check
        run: cd backend && mvn -B spotless:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service
      - name: Run Checkstyle
        run: cd backend && mvn -B checkstyle:check -pl meridian-domain,meridian-application,meridian-infrastructure,meridian-workflow-service -Dcheckstyle.failOnViolation=false

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Unit Tests
        run: cd backend && mvn -B test -pl meridian-domain,meridian-application
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/meridian-domain/target/site/jacoco/jacoco.xml,./backend/meridian-application/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Integration Tests
        run: cd backend && mvn -B verify -pl meridian-infrastructure,meridian-workflow-service -am -DskipUnitTests
